<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ecef"/>
      <stop offset="1" stop-color="#8796a0"/>
    </linearGradient>
    <radialGradient id="hot">
      <stop offset="0" stop-color="#ffe3a8"/>
      <stop offset="0.35" stop-color="#f2a23a"/>
      <stop offset="1" stop-color="#f2a23a" stop-opacity="0"/>
    </radialGradient>
    <path id="right-lung" d="M41 13C48.5 14 55.5 26 56 40.5 56.3 50 52 55.5 44.5 54.5 38.8 53.8 35.8 50.5 35.8 46V24C35.8 17.5 37.8 13 41 13Z"/>
    <clipPath id="clip-right"><use href="#right-lung"/></clipPath>
  </defs>
  <!-- Film plate -->
  <rect width="64" height="64" rx="14" fill="#0b0f12"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- Lungs, mirror images of each other -->
  <use href="#right-lung" fill="url(#film)" transform="matrix(-1 0 0 1 64 0)"/>
  <use href="#right-lung" fill="url(#film)"/>
  <!-- Trachea and main bronchi -->
  <path d="M32 7V24M32 24 26 30M32 24 38 30" fill="none" stroke="#e6ecef" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Attention hotspot, kept inside the lung like a heatmap -->
  <circle cx="45.5" cy="39" r="11" fill="url(#hot)" clip-path="url(#clip-right)"/>
</svg>
