name: Deploy Frontend to Azure SWA
on:
  push:
    branches: [ "**" ]
    paths: [ 'frontend/**', '.github/workflows/deploy-frontend.yml' ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Environment Variables
        id: set_env
        shell: bash
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "SWA_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.VITE_API_BASE_URL_PROD }}" >> $GITHUB_ENV
          else
            echo "SWA_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}" >> $GITHUB_ENV
            echo "API_URL=${{ secrets.VITE_API_BASE_URL_STAGING }}" >> $GITHUB_ENV
          fi

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend" 
          api_location: "" 
          output_location: "dist"
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}

