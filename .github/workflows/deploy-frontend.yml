name: Deploy Frontend to Azure SWA
on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**', '.github/workflows/deploy-frontend.yml' ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PROD || 'https://pulmolens-backend-frzdnerigq-uc.a.run.app' }}
          VITE_DEMO_MODE: false

      - name: Deploy to Azure
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          npx @azure/static-web-apps-cli deploy ./frontend/dist --env production --deployment-token $SWA_CLI_DEPLOYMENT_TOKEN
