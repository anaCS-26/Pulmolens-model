name: Deploy Backend to Container App
on:
  push:
    branches: [ main ]
    paths: [ 'backend/**', 'infra/**' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image
        run: |
          az acr build --registry ${{ secrets.AZURE_ACR_NAME }} --image pulmolens-backend:${{ github.sha }} ./backend

      - name: Validate required secrets are present
        shell: bash
        run: |
          test -n "${{ secrets.MODEL_SAS_URL }}" || (echo "MODEL_SAS_URL missing" && exit 1)
          test -n "${{ secrets.PINECONE_API_KEY }}" || (echo "PINECONE_API_KEY missing" && exit 1)
          test -n "${{ secrets.GOOGLE_API_KEY }}" || (echo "GOOGLE_API_KEY missing" && exit 1)
          test -n "${{ secrets.COSMOS_KEY }}" || (echo "COSMOS_KEY missing" && exit 1)
          test -n "${{ secrets.STORAGE_CONN_STR }}" || (echo "STORAGE_CONN_STR missing" && exit 1)
          test -n "${{ secrets.AZURE_ACR_NAME }}" || (echo "AZURE_ACR_NAME missing" && exit 1)

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        env:
          MODEL_SAS_URL: ${{ secrets.MODEL_SAS_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          STORAGE_CONN_STR: ${{ secrets.STORAGE_CONN_STR }}
        with:
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: pulmolens-container
          resourceGroup: PulmoLense
          imageToDeploy: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/pulmolens-backend:${{ github.sha }}
          yamlConfigPath: infra/aca-config.yaml
